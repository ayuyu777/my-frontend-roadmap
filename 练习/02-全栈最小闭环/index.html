========================================================================
  阶段 B · 全栈最小闭环（前端部分）
========================================================================

  先读 ./API.md，再动这个文件。

  这个页面要干的事：
    1. 打开时请求 GET /api/ping，显示"连接状态"      ✅ 已给出，当范例看
    2. 点"刷新"请求 GET /api/devices，把列表渲染出来  ⬜ 你来写
    3. 页面必须有 loading / empty / error 三种状态    ⬜ 你来写

  为什么"三态"这么重要：
    初级前端只写"成功"那一支。真实环境里，请求会超时、会 500、会返回空数组。
    面试官问"加载失败怎么办"，答不上来的人直接被归类为"只会跑通 happy path"。

  验收：
    [ ] 后端没启动时，页面显示错误提示，而不是一片空白
    [ ] 后端返回空数组时，页面显示"暂无设备"，而不是空白

========================================================================

<style>

const API_BASE = 'http://localhost:3000';

/* ==========================================================================
   范例：连接状态检测（已经写好了，读懂它）
   --------------------------------------------------------------------------
   这里用的是 fetch + try/catch。
   注意：fetch 只有"网络层失败"才 reject；
        服务器返回 500 也是 resolve 的，所以必须自己检查 res.ok。
        这是新手最常踩的坑之一。
   ========================================================================== */
async function checkPing() {
  const statusEl = document.getElementById('pingStatus');
  const textEl = document.getElementById('pingText');

  statusEl.className = 'status status--loading';
  textEl.textContent = '正在连接后端…';

  try {
    const res = await fetch(`${API_BASE}/api/ping`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    statusEl.className = 'status status--ok';
    textEl.textContent = `后端已连接 · 服务器时间 ${new Date(data.time).toLocaleTimeString()}`;
  } catch (err) {
    statusEl.className = 'status status--err';
    textEl.textContent = '后端未连接（先运行 node server.ts）';
    console.error('[ping] 失败:', err);
  }
}
